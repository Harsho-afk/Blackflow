server:
  port: "80"
  rate_limit:
      enabled: true
      requests_per_second: 10
      burst: 20
  routes:
    /auth:
      interval: 5s
      algorithm: round_robin
      backends:
        - http://auth1:8081
        - http://auth2:8082

    /api:
      interval: 10s
      algorithm: least_connection
      backends:
        - http://api1:8091
